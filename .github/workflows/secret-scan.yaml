name: Secret scan

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks (history and tree)
        run: |
          # gitleaks exits 0 when git itself fails (e.g. "dubious ownership"), scanning 0 commits; run as the
          # checkout owner and fail on any gitleaks error so the scan cannot pass silently.
          gl="docker run --rm -u $(id -u):$(id -g) -v $PWD:/repo ghcr.io/gitleaks/gitleaks:v8.28.0"
          $gl git /repo --redact --no-banner 2>&1 | tee gl-git.log
          $gl dir /repo --redact --no-banner 2>&1 | tee gl-dir.log
          ! grep -h "ERR" gl-git.log gl-dir.log
          ! grep -q " 0 commits scanned" gl-git.log
