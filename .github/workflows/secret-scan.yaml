name: Secret scan

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks (history and tree)
        run: |
          docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --no-banner
          docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:v8.28.0 dir /repo --redact --no-banner
